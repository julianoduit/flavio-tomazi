<dialog class="lightbox" id="lightbox" aria-label="Foto ampliada de antes e depois">
  <div class="lightbox-corpo">
    <button class="lightbox-fechar" type="button" data-fechar aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <picture>
      <source type="image/avif" srcset="">
      <source type="image/webp" srcset="">
      <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="1080" height="1080" alt="">
    </picture>
    <div class="lightbox-rodape">
      <div>
        <p class="lightbox-legenda"></p>
        <span class="lightbox-contador" aria-live="polite"></span>
      </div>
      <div class="lightbox-controles">
        <button type="button" data-anterior aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <button type="button" data-proximo aria-label="Próxima foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
  </div>
</dialog>
